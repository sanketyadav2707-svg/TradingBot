name: Python checks

on:
  push:
    branches: [main, "feature/dashboard-ci-api-contract", "feature/fastapi-readonly-service", "feature/persistent-paper-account", "feature/contract-roll-audit", "docs/orb15-pre-registered-spec", "feature/orb15-bracket-backtester", "feature/phase2-raw-data-quality", "feature/phase2-session-roll-adapters", "feature/marketparquet-continuous-adapter", "feature/vwap-compression-strategy-lab", "fix/paper-equity-snapshot-event-order", "feature/raw-contract-candidate-research-v2", "feature/phase3-holdout-evaluation-protocol", "feature/quantconnect-cloud-feasibility", "feature/zero-budget-data-inventory", "feature/vps-short-horizon-automation-architecture"]
  pull_request:
    branches: [main, "feature/dashboard-ci-api-contract", "feature/fastapi-readonly-service", "feature/persistent-paper-account", "feature/orb15-bracket-backtester", "feature/phase2-raw-data-quality", "feature/phase2-session-roll-adapters", "feature/marketparquet-continuous-adapter", "feature/vwap-compression-strategy-lab", "feature/phase3-holdout-evaluation-protocol", "feature/quantconnect-cloud-feasibility", "feature/zero-budget-data-inventory", "feature/vps-short-horizon-automation-architecture"]

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,parquet]"
      - name: Smoke test the installed API server
        run: |
          set -euo pipefail
          tradingbot-api --host 127.0.0.1 --port 8765 > /tmp/tradingbot-api.log 2>&1 &
          API_PID=$!
          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health > /tmp/tradingbot-health.json; then
              break
            fi
            sleep 1
          done

          python -c "import json; d=json.load(open('/tmp/tradingbot-health.json')); assert d['status'] == 'ok', d; print('API health:', d['status'], 'version:', d['version'])"
          curl --fail --silent http://127.0.0.1:8765/health/ready > /tmp/tradingbot-readiness.json
          python -c "import json; d=json.load(open('/tmp/tradingbot-readiness.json')); assert d['status'] == 'ready' and all(v == 'ok' for v in d['checks'].values()), d; assert d['trading_enabled'] is False and d['broker_connected'] is False and d['market_data_connected'] is False, d; print('Service readiness:', d['status'], d['checks'])"
          curl --fail --silent http://127.0.0.1:8765/api/v1/instruments > /tmp/tradingbot-instruments.json
          python -c "import json; d=json.load(open('/tmp/tradingbot-instruments.json')); symbols={x['symbol'] for x in d['items']}; expected={'MES','MNQ','MYM','M2K','MGC','MCL'}; assert d['availability'] == 'AVAILABLE' and expected <= symbols, d; print('Configured instruments:', ', '.join(sorted(symbols)))"
          curl --fail --silent http://127.0.0.1:8765/api/v1/dashboard/summary > /tmp/tradingbot-summary.json
          python -c "import json; d=json.load(open('/tmp/tradingbot-summary.json')); assert d['meta']['environment'] == 'PAPER' and d['account']['balance']['amount'] == '50000.00' and d['account']['equity']['amount'] == '50000.00', d; print('Persistent account:', d['meta']['environment'], 'equity USD', d['account']['equity']['amount'])"
          curl --fail --silent http://127.0.0.1:8765/api/v1/positions > /tmp/tradingbot-positions.json
          python -c "import json; d=json.load(open('/tmp/tradingbot-positions.json')); assert d['availability'] == 'AVAILABLE' and d['items'] == [], d; print('Position book: available, no open positions')"

      - name: Run tests
        run: pytest
