name: Phase 2 data-quality checks

on:
  push:
    branches: ["feature/phase2-raw-data-quality"]
  pull_request:
    branches: ["feature/orb15-bracket-backtester"]

permissions:
  contents: read

concurrency:
  group: phase2-data-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raw-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run raw-data, loader, audit and CLI regression tests
        run: |
          pytest tests/test_raw_futures_data.py tests/test_data.py tests/test_data_audit.py tests/test_databento_adapter.py tests/test_cli.py
