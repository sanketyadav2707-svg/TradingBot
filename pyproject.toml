[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-futures-tradingbot"
version = "0.1.0"
description = "Offline-first research and paper-trading framework for intraday futures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
marketdata = ["databento>=0.50", "pandas>=2.2", "python-dotenv>=1.0"]

[project.scripts]
tradingbot = "tradingbot.cli:main"
tradingbot-api = "tradingbot.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
